# Local PostgreSQL 16 for development only. Bind to loopback; password from env (never commit).
services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: trading
      POSTGRES_DB: trading_dev
      POSTGRES_PASSWORD: ${TRADING_DEV_DB_PASSWORD:?Set TRADING_DEV_DB_PASSWORD in docker/.env or the environment}
    volumes:
      - trading_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trading_pg_data:
