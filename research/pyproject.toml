[project]
name = "tradelab"
version = "0.1.0"
description = "Offline research, backtesting, and analytics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=26.0.0",
    "websockets>=14.0",
]

[project.scripts]
tradelab-ohlcv-backfill = "tradelab.cli.ohlcv_backfill:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradelab"]

[tool.hatch.build.targets.sdist]
include = ["src/tradelab", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = ["src/tradelab/journal/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tradelab/engine", "src/tradelab/data", "src/tradelab/cli"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = "tradelab.journal.generated"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
