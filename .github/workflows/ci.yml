# T-0002: CI skeleton. Build and test jobs are placeholders until T-0003+.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  large-file-check:
    name: large-file-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x tools/check_large_files.sh
          ./tools/check_large_files.sh

  skeleton-check:
    name: skeleton-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .handoff
          chmod +x tools/check_repo_skeleton.sh
          ./tools/check_repo_skeleton.sh

